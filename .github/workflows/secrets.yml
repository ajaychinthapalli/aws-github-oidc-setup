name: Fetch Secrets via OIDC

on:
  push:
    branches: [main]
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  fetch-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Step 3/4/5 in diagram: presents OIDC token, AWS validates
      # trust policy, STS returns short-lived credentials
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::573631993187:role/github-actions-oidc-role
          aws-region: us-east-2
          audience: sts.amazonaws.com

      # Step 6 in diagram: pull a sensitive secret from Secrets Manager
      - name: Get secret from Secrets Manager
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id aws-github-oidc-setup/db-password \
            --query SecretString --output text)
          echo "::add-mask::$SECRET"
          echo "DB_PASSWORD=$SECRET" >> "$GITHUB_ENV"

      # Non-sensitive config: AWS Systems Manager Parameter Store
      - name: Get parameter from SSM
        run: |
          VALUE=$(aws ssm get-parameter \
            --name /github-oidc-setup/api-endpoint \
            --query Parameter.Value --output text)
          echo "API_ENDPOINT=$VALUE" >> "$GITHUB_ENV"

      # Example: decrypt a KMS-encrypted SecureString parameter
      - name: Get encrypted parameter (KMS-backed)
        run: |
          VALUE=$(aws ssm get-parameter \
            --name /github-oidc-setup/encrypted-key \
            --with-decryption \
            --query Parameter.Value --output text)
          echo "::add-mask::$VALUE"
          echo "ENCRYPTED_KEY=$VALUE" >> "$GITHUB_ENV"

      - name: Use the secrets
        run: |
          echo "Connecting to $API_ENDPOINT..."
          # DB_PASSWORD and ENCRYPTED_KEY are now masked env vars
          # available to any later step in this job
